name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI verifies code, not the packaged GUI; the Electron binary is not needed.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  checks:
    name: Lint, format, audit (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version read from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - name: Dependency audit (fail on critical)
        # The npm audit endpoint intermittently returns responses this pnpm
        # cannot parse (ERR_PNPM_AUDIT_BAD_RESPONSE). Real critical
        # vulnerabilities still fail the job; a broken registry response is
        # retried, then reported as a warning instead of blocking CI.
        run: |
          for attempt in 1 2 3; do
            set +e
            output=$(pnpm audit --audit-level critical 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ $status -eq 0 ]; then exit 0; fi
            if ! echo "$output" | grep -q 'ERR_PNPM_AUDIT_BAD_RESPONSE'; then exit $status; fi
            echo "audit endpoint returned a bad response (attempt $attempt); retrying…"
            sleep 15
          done
          echo "::warning::npm audit endpoint unavailable (ERR_PNPM_AUDIT_BAD_RESPONSE); audit skipped this run."

  test:
    name: Typecheck + tests (${{ matrix.os }})
    # Cross-OS test matrix doubles as early native-module validation for the
    # Windows (S-113) and macOS arm64 (S-114) targets.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --no-bail run typecheck
      - run: pnpm exec vitest run
        env:
          CI: 'true'

  renderer-build:
    name: Renderer production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build --config vite.renderer.config.ts
        working-directory: apps/desktop

  e2e:
    name: E2E journey (windows)
    # The unit suite proves the rules; this proves they are REACHED — through
    # the IPC boundary, the encrypted database and the real screens. Windows
    # only: it is the practitioner's actual platform (S-113), and one run of a
    # serial journey is worth more than the same journey three times.
    runs-on: windows-latest
    env:
      # Needs the real Electron binary: the suite launches it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm 10+ does NOT run a dependency's postinstall unless it is
      # allowlisted in `onlyBuiltDependencies`, and this repo allowlists
      # nothing — so `node_modules/electron/dist` is never unpacked and the
      # suite has no binary to launch. A developer whose node_modules predates
      # that pnpm behaviour has the directory already, which is why this only
      # ever fails on a clean checkout. Idempotent: install.js exits early when
      # the binary is present.
      - name: Unpack the Electron binary the suite launches
        run: node node_modules/electron/install.js
      # pnpm installs the SQLite driver for the SYSTEM Node's ABI. The suite
      # runs it under Electron, which has a different one, so without this the
      # app dies on first unlock with a NODE_MODULE_VERSION mismatch.
      - run: pnpm fix:native
      # Produces .vite/build + .vite/renderer, which is what the suite loads.
      - run: pnpm --filter @ajnutrition/desktop package
      - name: Playwright journey
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm exec playwright test 2>&1 | tee e2e.log; then
            echo '--- e2e failed; surfacing log tail as annotations ---'
            tail -n 20 e2e.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
      # The failure context Playwright writes is the only way to see what the
      # screen actually said, since nobody can watch the run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-context
          path: test-results/
          retention-days: 7

  package:
    name: Package app (${{ matrix.os }})
    # Real packaged-app validation for S-113 (Windows) / S-114 (macOS arm64):
    # forge package (rebuild for Electron ABI, fuses, asar) + structural
    # verification that the native SQLite driver made it into the artifact.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # This job DOES need the Electron binary (empty string = do not skip).
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        shell: bash
        # On failure, surface the log tail as annotations (readable without
        # repo admin rights, unlike raw job logs).
        run: |
          set -o pipefail
          if ! pnpm --filter @ajnutrition/desktop package 2>&1 | tee forge-package.log; then
            echo '--- package failed; surfacing log tail as annotations ---'
            tail -n 8 forge-package.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
      - run: node scripts/verify-package.mjs apps/desktop/out
      # macOS only, and unsigned: this exists so a real .dmg can be downloaded
      # and opened on a Mac (S-114) without anyone owning a Mac to build it.
      # Gatekeeper WILL refuse it until signing and notarization are set up —
      # that is expected, and the artifact name says so.
      - name: Make DMG (unsigned)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm --filter @ajnutrition/desktop make 2>&1 | tee forge-make.log; then
            echo '--- make failed; surfacing log tail as annotations ---'
            tail -n 15 forge-make.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: nutriplan-macos-UNSIGNED-dmg
          path: apps/desktop/out/make/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ajnutrition-package-${{ matrix.os }}
          path: apps/desktop/out/
          retention-days: 3
